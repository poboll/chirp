<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:640px; background:linear-gradient(135deg,#e8f0e4 0%,#f5f0e6 100%); font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif; padding:28px; display:flex; justify-content:flex-end; align-items:flex-start; }
.scene { display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
.menubar { display:flex; align-items:center; gap:6px; height:28px; padding:0 10px; }
.bird-bar { height:15px; filter:brightness(0) opacity(.82); }
.menu { background:rgba(246,246,248,0.86); backdrop-filter:blur(20px); border:0.5px solid rgba(0,0,0,0.12); border-radius:8px; padding:4px; width:250px; box-shadow:0 8px 24px rgba(0,0,0,0.18); }
.mi { display:flex; justify-content:space-between; padding:3px 10px; border-radius:5px; font-size:13px; color:#1d1d1f; }
.mi .k { color:#86868b; font-size:12px; }
.mi.head { text-align:center; font-weight:600; }
.mi.stat { color:#6b7280; font-size:12px; }
.sep { height:0.5px; background:rgba(0,0,0,0.12); margin:4px 10px; }
.dot { width:8px; height:8px; border-radius:50%; background:#34c759; display:inline-block; margin-right:6px; }
</style></head>
<body>
<div class="scene">
  <div class="menubar"><img class="bird-bar" src="assets/icon.png" alt=""></div>
  <div class="menu">
    <div class="mi head">chirp. 报信小鸟 v1.0.0</div>
    <div class="sep"></div>
    <div class="mi stat"><span><span class="dot"></span>当前应用：微信</span></div>
    <div class="mi stat">博客显示：微信</div>
    <div class="mi stat">状态：已上报 21:30:12</div>
    <div class="sep"></div>
    <div class="mi"><span>暂停上报</span><span class="k">⌘P</span></div>
    <div class="mi"><span>打开配置文件</span><span class="k">⌘,</span></div>
    <div class="mi"><span>立即刷新</span><span class="k">⌘R</span></div>
    <div class="sep"></div>
    <div class="mi"><span>使用说明</span><span class="k">⌘H</span></div>
    <div class="mi"><span>关于 chirp.</span></div>
    <div class="mi"><span>GitHub 仓库 ↗</span></div>
    <div class="sep"></div>
    <div class="mi"><span>退出 chirp.</span><span class="k">⌘Q</span></div>
  </div>
</div>
</body></html>
